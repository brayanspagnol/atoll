# Atoll lock screen. It also greets you when the machine wakes from suspend.
# The wallpaper follows Settings, the picture and name come from your profile,
# and $PAMPROMPT and $PAMFAIL follow the system language.
$ink = rgb(243, 247, 251)
$muted = rgb(213, 221, 230)
$accent = rgb(140, 200, 245)
$danger = rgb(255, 154, 143)
$warn = rgb(233, 196, 106)
$glass = rgba(12, 18, 26, 0.55)
$rim = rgba(255, 255, 255, 0.26)
$shade = rgba(4, 10, 18, 0.45)
$sans = Instrument Sans
$mono = JetBrainsMono Nerd Font
$scripts = $HOME/.local/share/atoll/scripts

general {
    hide_cursor = true
    ignore_empty_input = true
    # Draws on the first frame after resume, so the desktop never flashes before the lock.
    immediate_render = true
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = soft, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 6, soft
    animation = fadeOut, 1, 4, soft
    animation = inputFieldDots, 1, 3, soft
}

background {
    monitor =
    path = ~/.local/share/atoll/current-wallpaper
    color = rgb(13, 21, 31)
    blur_passes = 0
    brightness = 0.82
}

# Top right: battery and keyboard layout.
label {
    monitor =
    text = cmd[update:30000] $scripts/lock-battery
    color = $ink
    font_size = 17
    font_family = $mono
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $shade
    position = -70, -50
    halign = right
    valign = top
}

label {
    monitor =
    text = $LAYOUT
    color = $ink
    font_size = 17
    font_family = $sans
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $shade
    position = -210, -50
    halign = right
    valign = top
}

# Bottom left, from the bottom up: song, clock, date.
label {
    monitor =
    text = cmd[update:3000] $scripts/lock-media
    color = $muted
    font_size = 21
    font_family = $sans
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $shade
    position = 4.4%, 90
    halign = left
    valign = bottom
}

label {
    monitor =
    text = $TIME
    color = $ink
    font_size = 280
    font_family = $sans
    shadow_passes = 2
    shadow_size = 7
    shadow_color = $shade
    position = 4%, 130
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:60000] $scripts/lock-date
    color = $ink
    font_size = 34
    font_family = $sans
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $shade
    position = 4.4%, 520
    halign = left
    valign = bottom
}

# Bottom right, from the edge in: password, picture, name.
input-field {
    monitor =
    size = 380, 72
    rounding = -1
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    outer_color = $rim
    inner_color = $glass
    font_color = $ink
    font_family = $sans
    fade_on_empty = false
    placeholder_text = <span foreground="##d5dde6">$PAMPROMPT</span>
    fail_text = <span foreground="##ff9a8f">$PAMFAIL</span>
    check_color = $accent
    fail_color = $danger
    capslock_color = $warn
    position = -140, 110
    halign = right
    valign = bottom
}

image {
    monitor =
    path = ~/.local/share/atoll/current-face
    size = 96
    rounding = -1
    border_size = 2
    border_color = rgba(255, 255, 255, 0.5)
    position = -544, 98
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:60000] $scripts/lock-name
    color = $ink
    font_size = 21
    font_family = $sans
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $shade
    position = -660, 130
    halign = right
    valign = bottom
}
