# Atoll lock screen.
$text = rgba(243, 247, 251, 1.0)
$muted = rgba(213, 221, 230, 1.0)
$accent = rgba(140, 200, 245, 0.9)
$surface = rgba(12, 18, 26, 0.55)
$font = Instrument Sans

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.local/share/atoll/wallpapers/atoll-dusk.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    color = $text
    font_size = 96
    font_family = $font
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $muted
    font_size = 20
    font_family = $font
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    rounding = 28
    outline_thickness = 1
    outer_color = $accent
    inner_color = $surface
    font_color = $text
    font_family = $font
    placeholder_text = <span foreground="##d5dde6">senha</span>
    fail_text = <span foreground="##ff9a8f">tente de novo</span>
    fade_on_empty = false
    position = 0, -20
    halign = center
    valign = center
}
