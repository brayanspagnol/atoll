# Atoll lock screen. It also greets you when the machine wakes from suspend.
# The wallpaper follows Settings, $PAMPROMPT and $PAMFAIL follow the system language, and the picture comes from your profile.
$ink = rgb(243, 247, 251)
$muted = rgb(213, 221, 230)
$accent = rgb(140, 200, 245)
$danger = rgb(255, 154, 143)
$warn = rgb(233, 196, 106)
$glass = rgba(12, 18, 26, 0.5)
$rim = rgba(255, 255, 255, 0.26)
$sans = Instrument Sans
$mono = JetBrainsMono Nerd Font
$scripts = $HOME/.local/share/atoll/scripts

general {
    hide_cursor = true
    ignore_empty_input = true
    # Draws on the first frame after resume, so the desktop never flashes before the lock.
    immediate_render = true
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = soft, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 6, soft
    animation = fadeOut, 1, 4, soft
    animation = inputFieldDots, 1, 3, soft
}

background {
    monitor =
    path = ~/.local/share/atoll/current-wallpaper
    color = rgb(13, 21, 31)
    blur_passes = 3
    blur_size = 10
    brightness = 0.55
    contrast = 1.05
    vibrancy = 0.2
}

# Status pill: the same place and shape as the island.
shape {
    monitor =
    size = 320, 56
    rounding = -1
    color = $glass
    border_size = 1
    border_color = $rim
    position = 0, -14
    halign = center
    valign = top
}

label {
    monitor =
    text = $LAYOUT
    color = $ink
    font_size = 14
    font_family = $sans
    position = -64, -32
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:30000] $scripts/lock-battery
    color = $ink
    font_size = 14
    font_family = $mono
    position = 92, -31
    halign = center
    valign = top
}

label {
    monitor =
    text = $TIME
    color = $ink
    font_size = 168
    font_family = $sans
    position = 0, 250
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $muted
    font_size = 24
    font_family = $sans
    position = 0, 130
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3000] $scripts/lock-media
    color = $muted
    font_size = 15
    font_family = $sans
    position = 0, 84
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/.local/share/atoll/current-face
    size = 96
    rounding = -1
    border_size = 1
    border_color = $rim
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $ink
    font_size = 17
    font_family = $sans
    position = 0, -130
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 56
    rounding = -1
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    outer_color = $rim
    inner_color = $glass
    font_color = $ink
    font_family = $sans
    fade_on_empty = false
    placeholder_text = <span foreground="##d5dde6">$PAMPROMPT</span>
    fail_text = <span foreground="##ff9a8f">$PAMFAIL</span>
    check_color = $accent
    fail_color = $danger
    capslock_color = $warn
    position = 0, -196
    halign = center
    valign = center
}
