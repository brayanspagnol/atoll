general {
    lock_cmd = pidof hyprlock || hyprlock -c $HOME/.config/atoll/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
listener {
    timeout = 300
    on-timeout = $HOME/.local/share/atoll/scripts/on-ac && loginctl lock-session
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
listener {
    timeout = 360
    on-timeout = $HOME/.local/share/atoll/scripts/on-ac && hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
listener {
    timeout = 60
    on-timeout = $HOME/.local/share/atoll/scripts/on-ac || loginctl lock-session
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
listener {
    timeout = 120
    on-timeout = $HOME/.local/share/atoll/scripts/on-ac || hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
listener {
    timeout = 180
    on-timeout = $HOME/.local/share/atoll/scripts/on-ac || systemctl suspend
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
