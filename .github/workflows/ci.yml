name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Logic tests
        run: node tests/test.mjs
      - name: Install linters
        run: sudo apt-get update && sudo apt-get install -y lua5.4 shellcheck
      - name: Lua syntax
        run: for f in hypr/*.lua; do luac5.4 -p "$f"; done
      - name: Shell scripts
        run: shellcheck -s bash scripts/* install.sh uninstall.sh
      - name: Version format
        run: grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
